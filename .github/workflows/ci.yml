name: ci

on:
  push:
    branches: [main, token-diet, token-diet-phase2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci-requirements.txt
      - name: CPU test dependencies
        run: pip install -r .github/workflows/ci-requirements.txt
      - name: Syntax check
        run: python3 -m compileall -q tools tests
      - name: Model routing config
        run: python3 tools/model_verify.py --validate-only
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v